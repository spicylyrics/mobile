name: Desktop installer

# Builds the Spicy Lyrics Desktop MSI and uploads it as a workflow artifact. Nothing is
# published: no GitHub release, no tag.
on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # cargo is on the runner image; this only caches the helper's build.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/gsmtc
      - uses: gradle/actions/setup-gradle@v6
      - name: Version from tag
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/desktop-v*)
              version="${GITHUB_REF_NAME#desktop-v}"
              if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Tag $GITHUB_REF_NAME is not desktop-vMAJOR.MINOR.BUILD" >&2
                exit 1
              fi
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "name=$version" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "name=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
              ;;
          esac
      # The Compose plugin downloads WiX 3 for jpackage itself, so the runner needs none.
      - name: Build MSI
        env:
          # Publishable key; blank leaves the Spicy Lyrics source out. Gradle checks its shape.
          SPICY_LYRICS_CLIENT_KEY: ${{ secrets.SPICY_LYRICS_CLIENT_KEY || vars.SPICY_LYRICS_CLIENT_KEY }}
          DESKTOP_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew.bat --no-daemon :desktop:packageMsi ${DESKTOP_VERSION:+-PdesktopVersion=$DESKTOP_VERSION}
      # The app can't open its window without skiko's native library beside its jars.
      - name: Check the MSI carries skiko's native library
        shell: pwsh
        run: |
          $msi = Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP "msi-image"
          Start-Process msiexec -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$out`"" -Wait
          $dll = Get-ChildItem $out -Recurse -Filter "skiko-windows-x64.dll" | Select-Object -First 1
          if (-not $dll) { Write-Error "skiko-windows-x64.dll is missing from the MSI's app"; exit 1 }
          Write-Output "Found $($dll.FullName)"
      - name: Checksum
        run: |
          cd desktop/build/compose/binaries/main/msi
          ls -l *.msi
          sha256sum *.msi | tee SHA256SUMS
      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: spicy-lyrics-desktop-${{ steps.version.outputs.name }}
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/msi/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      # A release later: give the job `contents: write` and add a step like android-release.yml's
      # "Publish prerelease", e.g.
      #   gh release create "$GITHUB_REF_NAME" desktop/build/compose/binaries/main/msi/*.msi \
      #     --repo "$GITHUB_REPOSITORY" --title "Spicy Lyrics Desktop ${{ steps.version.outputs.name }}" \
      #     --generate-notes --prerelease --verify-tag
      # guarded by `if: startsWith(github.ref, 'refs/tags/desktop-v')`.

  # Linux: reads players through playerctl, so no helper to build.
  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      # jpackage builds the .deb under fakeroot.
      - name: Packaging tools
        run: sudo apt-get update -q && sudo apt-get install -y -q fakeroot
      - name: Version from tag
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/desktop-v*)
              version="${GITHUB_REF_NAME#desktop-v}"
              if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Tag $GITHUB_REF_NAME is not desktop-vMAJOR.MINOR.BUILD" >&2
                exit 1
              fi
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "name=$version" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "name=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Build .deb
        env:
          SPICY_LYRICS_CLIENT_KEY: ${{ secrets.SPICY_LYRICS_CLIENT_KEY || vars.SPICY_LYRICS_CLIENT_KEY }}
          DESKTOP_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon :desktop:packageDeb ${DESKTOP_VERSION:+-PdesktopVersion=$DESKTOP_VERSION}
      - name: Check the .deb carries skiko's native library
        run: |
          deb=$(ls desktop/build/compose/binaries/main/deb/*.deb | head -1)
          dpkg-deb -c "$deb" | grep -q 'libskiko-linux-x64\.so$' || { echo "libskiko-linux-x64.so is missing from the .deb" >&2; exit 1; }
      - name: Checksum
        run: |
          cd desktop/build/compose/binaries/main/deb
          ls -l *.deb
          sha256sum *.deb | tee SHA256SUMS
      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: spicy-lyrics-desktop-deb-${{ steps.version.outputs.name }}
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/deb/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # macOS: no media source yet (it shows "waiting"), but the app builds and packages. Unsigned.
  dmg:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Version from tag
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/desktop-v*)
              version="${GITHUB_REF_NAME#desktop-v}"
              if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Tag $GITHUB_REF_NAME is not desktop-vMAJOR.MINOR.BUILD" >&2
                exit 1
              fi
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "name=$version" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "name=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Build .dmg
        env:
          SPICY_LYRICS_CLIENT_KEY: ${{ secrets.SPICY_LYRICS_CLIENT_KEY || vars.SPICY_LYRICS_CLIENT_KEY }}
          DESKTOP_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon :desktop:packageDmg ${DESKTOP_VERSION:+-PdesktopVersion=$DESKTOP_VERSION}
      - name: Check the .dmg carries skiko's native library
        run: |
          dmg=$(ls desktop/build/compose/binaries/main/dmg/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          found=$(find "$mnt" -name 'libskiko-macos-*.dylib' | head -1)
          hdiutil detach "$mnt" >/dev/null
          [ -n "$found" ] || { echo "libskiko-macos-*.dylib is missing from the .dmg" >&2; exit 1; }
          echo "Found $found"
      - name: Checksum
        run: |
          cd desktop/build/compose/binaries/main/dmg
          ls -l *.dmg
          shasum -a 256 *.dmg | tee SHA256SUMS
      - name: Upload .dmg
        uses: actions/upload-artifact@v7
        with:
          name: spicy-lyrics-desktop-dmg-${{ steps.version.outputs.name }}
          path: |
            desktop/build/compose/binaries/main/dmg/*.dmg
            desktop/build/compose/binaries/main/dmg/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
