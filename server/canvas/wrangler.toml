name = "spicy-lyrics-canvas"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Remembers found canvases globally so they keep working while the lookup services are down.
# Created with `npx wrangler kv namespace create CANVAS`; a fork makes its own and puts its id
# here. Without the binding the Worker still runs, with only the per-data-centre cache.
[[kv_namespaces]]
binding = "CANVAS"
id = "d01d592a039f45e88b22f91f5b70a89f"

# [vars]
# UPSTREAMS = "https://spotify-canva.vercel.app/api/canvas"
