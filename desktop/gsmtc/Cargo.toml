[package]
name = "gsmtc"
version = "0.1.0"
edition = "2021"

# Prints Windows' media sessions (GSMTC) as JSON lines, one per session per change.
[dependencies]
serde_json = "1"
windows = { version = "0.61", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_System_WinRT"] }
windows-future = "0.2"
